<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход · Price Watch</title>
<style>
body{margin:0;background:#121417;color:#e3e5e8;font:13px -apple-system,sans-serif;display:grid;place-items:center;min-height:100vh}
.box{background:#1a1d21;border:1px solid #2c3038;padding:24px;border-radius:8px;width:100%;max-width:340px}
h2{margin:0 0 16px;font-size:16px;color:#fff}
.group{margin-bottom:12px}
label{display:block;font-size:11px;color:#8a9ba8;margin-bottom:4px}
input{width:100%;background:#121417;border:1px solid #2c3038;color:#fff;padding:8px 10px;border-radius:6px;font:inherit;outline:none}
input:focus{border-color:#2787f5}
.btn{width:100%;background:#2787f5;color:#fff;border:0;padding:9px;border-radius:6px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:hover{background:#1b73d1}
.toggle{text-align:center;margin-top:12px;font-size:11px;color:#8a9ba8;cursor:pointer}
.toggle span{color:#2787f5}
.err{color:#e04848;font-size:11px;margin-bottom:10px}
</style>
</head>
<body>
<div class="box">
  <h2 id="title">Вход в систему</h2>
  <div id="err" class="err"></div>
  <div class="group">
    <label>Имя пользователя</label>
    <input id="user" placeholder="Логин">
  </div>
  <div class="group">
    <label>Пароль</label>
    <input id="pass" type="password" placeholder="Пароль">
  </div>
  <div class="group" id="keyGroup" style="display:none">
    <label>Ключ доступа</label>
    <input id="regKey" placeholder="Выданный ключ">
  </div>
  <button class="btn" id="submitBtn" onclick="handleAuth()">Войти</button>
  <div class="toggle" onclick="toggleMode()"><span id="toggleText">Регистрация по ключу</span></div>
  <div style="text-align:center;margin-top:10px"><a href="index.html" style="color:#8a9ba8;font-size:11px;text-decoration:none">← На главную</a></div>
</div>

<script src="app.js"></script>
<script>
let isReg = false;
function toggleMode() {
  isReg = !isReg;
  document.getElementById('title').textContent = isReg ? 'Регистрация сотрудника' : 'Вход в систему';
  document.getElementById('submitBtn').textContent = isReg ? 'Зарегистрироваться' : 'Войти';
  document.getElementById('keyGroup').style.display = isReg ? 'block' : 'none';
  document.getElementById('toggleText').textContent = isReg ? 'Уже есть аккаунт? Войти' : 'Регистрация по ключу';
  document.getElementById('err').textContent = '';
}

function handleAuth() {
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value.trim();
  const k = document.getElementById('regKey').value.trim();
  const err = document.getElementById('err');
  
  if(!u || !p) { err.textContent = 'Заполните все поля'; return; }

  const res = loginOrRegister(u, p, k, isReg);
  if(res.success) {
    location.href = 'index.html';
  } else {
    err.textContent = res.error;
  }
}
</script>
</body>
</html>
