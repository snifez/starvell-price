<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRICE WATCH · Справочник цен</title>
<style>
:root{--bg:#121417;--panel:#1a1d21;--border:#2c3038;--text:#e3e5e8;--muted:#8a9ba8;--blue:#2787f5;--blue-hover:#1b73d1;--yellow:#f5c85b;--red:#e04848}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,blinkmacsysteminfo,"Segoe UI",roboto,helvetica,arial,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:20px}
.brand{font-weight:700;font-size:14px;color:#fff;padding-bottom:15px;border-bottom:1px solid var(--border)}
.nav-label{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:600;letter-spacing:.05em;margin-bottom:6px}
.tabs{display:flex;flex-direction:column;gap:4px}
.tab{background:transparent;border:0;color:var(--muted);text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-weight:500}
.tab:hover{background:#23272a;color:#fff}
.tab.active{background:var(--blue);color:#fff}
.user-panel{margin-top:auto;background:#16181b;border:1px solid var(--border);padding:12px;border-radius:8px;font-size:12px}
.user-info{margin-bottom:8px;word-break:break-all}
.btn{background:var(--blue);color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:500;font-size:12px;text-decoration:none;display:inline-block;text-align:center;width:100%}
.btn:hover{background:var(--blue-hover)}
.btn-red{background:var(--red)}
.btn-red:hover{background:#c73b3b}
.main{padding:24px;max-width:1600px;margin:0 auto;width:100%}
.topline{margin-bottom:20px}
.topline h1{font-size:20px;margin:0 0 5px;color:#fff}
.topline p{margin:0;color:var(--muted);font-size:12px}
.controls{display:flex;gap:10px;margin-bottom:15px}
.controls input,.controls select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font:inherit;outline:none}
.controls input{flex:1}
.controls input:focus,.controls select:focus{border-color:var(--blue)}
.tablebox{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.table-scroll{overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;min-width:1100px}
th{position:sticky;top:0;background:#16181b;color:var(--muted);text-align:left;font-size:11px;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px}
tr:hover{background:#1e2125}
.tag{background:#23272a;border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-size:11px;color:#99aab5}
.price{font-weight:600;color:#fff}
.threshold{color:var(--yellow);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">PRICE WATCH</div>
    <div>
      <div class="nav-label">Категории</div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="user-panel" id="userPanel"></div>
  </aside>

  <main class="main">
    <div class="topline">
      <h1>Справочник цен и сигналов</h1>
      <p>Оперативная база данных для проверки лотов</p>
    </div>

    <div class="controls">
      <input id="search" placeholder="Поиск по предмету, игре или сигналу…">
      <select id="sort">
        <option value="default">Сортировка: исходная</option>
        <option value="low">Сначала дешевле</option>
        <option value="high">Сначала дороже</option>
      </select>
    </div>

    <div class="tablebox">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Товар / позиция</th>
              <th>Игра</th>
              <th>Тип</th>
              <th>Цена от</th>
              <th>Цена до</th>
              <th>Порог</th>
              <th>Сигнал</th>
              <th>Источник</th>
            </tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
