<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Price Watch: цены для агентов</title>
<style>
:root{--bg:#17181c;--p:#1f2126;--p2:#272a31;--b:#2e3138;--t:#e6e8eb;--m:#8b93a0;--blue:#2f7df6;--blue2:#2468d1;--red:#e5484d;--yel:#f5b83d;--grn:#3cc17a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:9px 11px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{background:var(--blue);border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;color:#fff}
.btn:hover{background:var(--blue2)}
.btn.g{background:var(--p2);border:1px solid var(--b);color:var(--t)}.btn.g:hover{background:var(--b)}
.btn.r{background:transparent;border:1px solid var(--b);color:var(--red)}
.btn.s{padding:5px 10px;font-size:12px}
label{display:block;font-size:12px;color:var(--m);margin:0 0 4px}
.login{max-width:400px;margin:8vh auto;padding:0 16px}
.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:16px}
.login h1{margin:0 0 4px;font-size:22px}.sub{color:var(--m);margin:0 0 16px}
.f{display:grid;gap:12px;margin-top:14px}
.seg{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--b)}
.seg button{flex:1;background:transparent;border:0;padding:7px;border-radius:7px;color:var(--m);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff;font-weight:600}
.err{color:var(--red);min-height:18px;font-size:13px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--b);background:var(--p)}
.brand{font-weight:700;font-size:16px}.brand i{color:var(--blue);font-style:normal}
.sp{flex:1}.who{color:var(--m);font-size:13px}
.lay{display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:16px;max-width:1500px;margin:0 auto;padding:16px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{text-align:left;background:transparent;border:0;padding:8px 11px;border-radius:7px;color:var(--m);cursor:pointer;display:flex;justify-content:space-between}
.nav button:hover{background:var(--p2);color:var(--t)}
.nav button[aria-pressed=true]{background:var(--blue);color:#fff}
.nav small{opacity:.75}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools input{flex:1 1 200px}.tools select{width:auto}
.box{overflow:auto;border:1px solid var(--b);border-radius:12px;background:var(--p);max-height:72vh}
table{width:100%;border-collapse:collapse;min-width:720px}
th{position:sticky;top:0;background:var(--p2);color:var(--m);font-size:12px;text-align:left;padding:9px 12px;font-weight:600}
td{padding:8px 12px;border-top:1px solid var(--b);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--p2)}tbody tr.sel{background:#1c2c47}
td.n{text-align:right;white-space:nowrap}.nm{font-weight:600}.mu{color:var(--m);font-size:12px}
.tag{font-size:11px;border:1px solid var(--b);border-radius:999px;padding:1px 8px;color:var(--m);white-space:nowrap}
.side{display:grid;gap:12px;align-content:start}
.side h3,.card h3{margin:0 0 10px;font-size:15px}
.fl{display:grid;gap:6px;margin:10px 0}.fl label{display:flex;gap:8px;align-items:flex-start;color:var(--t);font-size:13px;margin:0;cursor:pointer}
.fl input{width:auto;margin-top:3px}
.vd{border-radius:8px;padding:10px 12px;background:var(--bg);border:1px solid var(--b);margin-top:10px}
.vd b{display:block;font-size:15px}.vd.ok b{color:var(--grn)}.vd.warn b{color:var(--yel)}.vd.bad b{color:var(--red)}
.log div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--b);font-size:13px}
.adm{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.list>div{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--b);flex-wrap:wrap}
.list .g1{flex:1;min-width:140px}
.note{background:#1c2c47;border:1px solid #2b4a7c;border-radius:8px;padding:9px 12px;font-size:13px}
.code{font:700 20px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;color:var(--blue);word-break:break-all}
.hot{border-color:var(--yel);color:var(--yel)}.srcs{font-size:11px;margin-top:2px}.srcs a{color:var(--blue);text-decoration:none}.srcs a:hover{text-decoration:underline}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media (max-width:1000px){.lay{grid-template-columns:1fr}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;gap:8px}}
</style>
</head>

${grp==="Редкие"?`<div class="note" style="margin-bottom:12px">Редкие предметы, которые могут продавать дёшево. Где нет подтверждённой цены, порог задан по уровню редкости (Топ 10 000 ₽, Высокий 1 500 ₽, Средний 300 ₽) и это эвристика, а не рыночная цена.</div>`:""}<div class="box"><table><thead><tr><th>Товар</th><th>Тип</th><th class="n">Цена от</th><th class="n">Цена до</th><th class="n">Порог</th><th class="n">Обновлено</th></tr></thead><tbody id="tb"></tbody></table></div></main>
<aside class="side"><div class="card"><h3>Проверка лота</h3><label for="sc">Вставьте название лота</label><textarea id="sc" rows="2" placeholder="Например: AWP Dragon Lore FN 500 ₽"></textarea><div class="mu" id="sm" style="margin:4px 0 10px">Сайт сам найдёт предмет и цену.</div><label for="it">Товар</label><input id="it" list="dl" autocomplete="off" placeholder="Выберите из таблицы или введите"><datalist id="dl">${all.map(r=>`<option value="${esc(r.n)}">`).join("")}</datalist>
<label for="pr" style="margin-top:10px">Цена лота, ₽</label><input id="pr" type="number" min="0" step="any" inputmode="decimal">
<div class="row" style="margin-top:10px"><div><label for="rv">Отзывов у продавца</label><input id="rv" type="number" min="0"></div><div><label for="pc">Выполнено, %</label><input id="pc" type="number" min="0" max="100"></div></div><div class="fl">${FL.map((f,i)=>`<label><input type="checkbox" data-f="${i}">${f}</label>`).join("")}</div>
<div class="vd" id="vd">Выберите товар и введите цену.</div><div class="srcs" id="sl" style="margin-top:8px"></div><button class="btn g s" id="cp" style="margin-top:10px" hidden>Скопировать заметку</button></div>
<div class="card log"><h3>Журнал проверок</h3><div id="lg"></div></div></aside></div>`);
 document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{grp=b.dataset.g;mainView()});
 $("#q").oninput=$("#so").onchange=rows;$("#it").oninput=$("#pr").oninput=$("#rv").oninput=$("#pc").oninput=verdict;$("#sc").oninput=scan;document.querySelectorAll("[data-f]").forEach(c=>c.onchange=verdict);
 $("#tb").onclick=e=>{const tr=e.target.closest("tr");if(!tr||!tr.dataset.id)return;selId=tr.dataset.id;const r=items().find(x=>String(x.id)===String(selId));$("#it").value=r.n;$("#pr").focus();rows();verdict()};
 rows();verdict();lg()}
function rows(){const q=$("#q").value.trim().toLowerCase(),so=$("#so").value;
 let L=items().filter(r=>(grp==="Все"||r.g===grp)&&(r.n+" "+r.t+" "+r.s+" "+(r.al||"")).toLowerCase().includes(q));
 L.sort((a,b)=>so==="n"?a.n.localeCompare(b.n):so==="hi"?(b.b??b.a??-1)-(a.b??a.a??-1):(a.a??1e12)-(b.a??1e12));
 $("#tb").innerHTML=L.length?L.map(r=>`<tr data-id="${r.id}" class="${String(r.id)===String(selId)?"sel":""}"><td><div class="nm">${esc(r.n)}</div><div class="mu">${esc(r.c)}</div><div class="srcs">${srcLinks(r)}</div></td><td>${r.h?`<span class="tag hot">${r.h}</span> `:""}<span class="tag">${esc(r.s)}</span> <span class="mu">${esc(r.t)}</span></td><td class="n">${fmt(r.a)}</td><td class="n">${fmt(r.b)}</td><td class="n">${fmt(th(r))}</td><td class="n mu" style="${r.u&&Date.now()-r.u>12096e5?"color:var(--yel)":""}">${r.u?dt(r.u):"—"}</td></tr>`).join(""):`<tr><td colspan="6" class="mu">Ничего не найдено. Измените запрос или раздел.</td></tr>`}
let last=null;
function scan(){const t=$("#sc").value.toLowerCase(),sm=$("#sm");if(!t.trim()){sm.textContent="Сайт сам найдёт предмет и цену.";return}
 let best=null,bl=0;for(const r of items()){for(const k of [r.n.toLowerCase().replace(/\(.*?\)/g,"").replace(/[★|]/g," ").replace(/\s+/g," ").trim(),...(r.al||"").split(",")]){if(k.length>=4&&t.includes(k)&&k.length>bl){best=r;bl=k.length}}}
 const m=t.match(/(\d[\d\s]*(?:[.,]\d+)?)\s*(?:₽|руб|р(?![а-яёa-z])|rub)/)||t.match(/(\d+(?:[.,]\d+)?)(?!.*\d)/);const p=m?parseFloat(m[1].replace(/\s/g,"").replace(",",".")):NaN;
 if(best)$("#it").value=best.n;if(!isNaN(p))$("#pr").value=p;
 sm.textContent=(best?"Найдено: "+best.n:"Предмет не найден, выберите вручную")+(isNaN(p)?"; цена не найдена":"; цена "+fmt(p));verdict()}
function verdict(){const v=$("#vd"),cp=$("#cp"),nm=$("#it").value.trim().toLowerCase(),p=parseFloat($("#pr").value);
 const r=items().find(x=>x.n.toLowerCase()===nm);cp.hidden=true;last=null;$("#sl").innerHTML=r?"Смотреть цены: "+srcLinks(r):"";
 if(!r||isNaN(p)){v.className="vd";v.textContent=r?"Введите цену лота.":"Выберите товар и введите цену.";return}
 const fl=[...document.querySelectorAll("[data-f]:checked")].map(c=>FL[c.dataset.f]),rv=parseFloat($("#rv").value),pc=parseFloat($("#pc").value);
 if(rv<10)fl.push("Мало отзывов (меньше 10)");if(pc<90)fl.push("Выполнено меньше 90% заказов");const j=judge(r,p,fl);
 v.className="vd "+j.l[1];v.innerHTML=`<b>${j.l[0]}</b>${j.nt.length?esc(j.nt.join("; "))+".":"Цена в пределах ориентира."}<div class="mu">Ориентир ${fmt(r.a)} – ${fmt(r.b)}</div>`;
 selId=r.id;last={r,p,fl,j};cp.hidden=false;
 cp.onclick=async()=>{const t=`Лот: ${r.n}\nЦена: ${fmt(p)}\nОриентир: ${fmt(r.a)} – ${fmt(r.b)}, порог ${fmt(th(r))}\nФлаги: ${fl.length?fl.join("; "):"нет"}\nИтог: ${j.l[0]}${j.nt.length?" ("+j.nt.join("; ")+")":""}`;
  try{await navigator.clipboard.writeText(t)}catch{prompt("Скопируйте заметку",t)}
  const a=LOG();a.unshift({t:Date.now(),n:r.n,p,l:j.l[0]});try{localStorage.setItem("pw_log",JSON.stringify(a.slice(0,8)))}catch{}lg();cp.textContent="Скопировано";setTimeout(()=>cp.textContent="Скопировать заметку",1500)}}
function lg(){const a=LOG();$("#lg").innerHTML=a.length?a.map(x=>`<div><span>${esc(x.n)} · ${fmt(x.p)}</span><span class="mu">${esc(x.l)}</span></div>`).join(""):`<div class="mu">Пока пусто. Заметки появляются после копирования.</div>`}
async function adminView(){if(!ME||ME.role!=="admin"){mainView();return}const all=items();
 if(tab!=="pr"){try{CODES=await rpc("app_admin_codes",{p_token:TOK})}catch(e){if(/сесс/i.test(e.message))return logout();CODES=[]}}
 const T=(k,t)=>`<button class="btn ${tab===k?"":"g"} s" data-t="${k}">${t}</button>`,fc=c=>c.match(/.{4}/g).join("-"),ok=c=>!c.revoked&&!(c.e&&c.e<Date.now());let b="";
 if(tab!=="pr")b=`<h3>Коды доступа</h3>${flash?`<div class="note">Новый код, скопируйте и отправьте человеку:<div class="code">${esc(flash)}</div><button class="btn g s" data-a="cc" style="margin-top:8px">Скопировать</button></div>`:""}
<div class="row" style="margin:12px 0"><div><label for="lb">Для кого (метка)</label><input id="lb" placeholder="например, Иван"></div><div><label for="us">Срок, дней (0 без срока)</label><input id="us" type="number" min="0" value="30"></div><button class="btn" data-a="mk">Создать код</button></div>
<div class="list">${CODES.length?CODES.map(c=>`<div><span class="g1"><span class="dot" style="background:${ok(c)?"var(--grn)":"var(--red)"}"></span><b>${esc(c.l||"без метки")}</b> <span class="mu">${fc(c.code)} · ${c.e?"до "+dt(c.e):"без срока"} · ${c.d?"привязан к устройству":"не активирован"}</span></span><button class="btn g s" data-a="cp" data-id="${c.id}">Копировать</button>${c.d?`<button class="btn g s" data-a="rd" data-id="${c.id}">Сбросить устройство</button>`:""}<button class="btn ${c.revoked?"g":"r"} s" data-a="rv" data-id="${c.id}">${c.revoked?"Включить":"Отозвать"}</button><button class="btn g s" data-a="di" data-id="${c.id}">Удалить</button></div>`).join(""):`<div class="mu">Кодов пока нет.</div>`}</div><p class="mu">Код привязывается к первому устройству. Если человек сменил устройство, сбросьте привязку.</p>`;
 if(tab==="pr")b=`<h3>Цены и позиции</h3><div class="row"><div><label for="en">Название</label><input id="en" list="el" placeholder="Выберите или введите новое"><datalist id="el">${all.map(r=>`<option value="${esc(r.n)}">`).join("")}</datalist></div><div><label for="eg">Раздел</label><input id="eg" list="gl"><datalist id="gl">${[...new Set(all.map(r=>r.g))].map(g=>`<option value="${esc(g)}">`).join("")}</datalist></div><div><label for="es">Игра</label><input id="es"></div><div><label for="et">Тип</label><input id="et"></div><div><label for="ea">Цена от, ₽</label><input id="ea" type="number" step="any"></div><div><label for="eb">Цена до, ₽</label><input id="eb" type="number" step="any"></div></div>
<div style="margin:10px 0"><label for="ec">Заметка</label><input id="ec"></div><button class="btn" data-a="sv">Сохранить</button> <button class="btn r" data-a="dl">Удалить позицию</button><p class="mu">Если название совпадает с существующим, позиция обновится. Иначе будет добавлена новая.</p>`;
 if(tab==="pr"&&!all.length)b=`<div class="note" style="margin-bottom:12px">Таблица на сервере пуста.</div><button class="btn" data-a="imp">Импортировать начальные цены (${BASE.length})</button>`;
 $("#app").innerHTML=shell(`<div class="adm"><div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${T("codes","Коды")}${T("pr","Цены")}</div><div class="note" style="margin-bottom:12px">Данные хранятся на сервере, правки видят все сразу.</div>${b}</div></div>`);
 if(tab==="pr")$("#en").oninput=()=>{const r=all.find(x=>x.n.toLowerCase()===$("#en").value.trim().toLowerCase());if(r){["g","s","t","a","b","c"].forEach((k,i)=>$("#e"+"gstabc"[i]).value=r[k]??"")}}}
async function adm(a,id){if(!ME||ME.role!=="admin")return;const all=items(),P={p_token:TOK};
 try{
 if(a==="mk")flash=(await rpc("app_admin_new_code",{...P,p_label:$("#lb").value.trim(),p_days:Math.max(0,parseInt($("#us").value)||0)})).code;
 else if(a==="cc"){await copy(flash);return}
 else if(a==="cp"){await copy(CODES.find(c=>c.id===id).code.match(/.{4}/g).join("-"));return}
 else if(a==="rv"||a==="rd"||a==="di"){if(a==="di"&&!confirm("Удалить код?"))return;await rpc("app_admin_code",{...P,p_id:id,p_op:{rv:"toggle",rd:"reset",di:"delete"}[a]});flash=""}
 else if(a==="imp"){await rpc("app_admin_import",{...P,p_items:BASE.map(rowObj)});await load()}
 else if(a==="sv"){const n=$("#en").value.trim();if(!n)return;const r=all.find(x=>x.n.toLowerCase()===n.toLowerCase()),num=v=>v===""?null:+v;
  await rpc("app_admin_item",{...P,p_item:{id:r?r.id:null,n,g:$("#eg").value.trim()||"Другое",s:$("#es").value.trim(),t:$("#et").value.trim(),a:num($("#ea").value),b:num($("#eb").value),c:$("#ec").value.trim(),h:r?.h||"",al:r?.al||""}});await load()}
 else if(a==="dl"){const n=$("#en").value.trim(),r=all.find(x=>x.n.toLowerCase()===n.toLowerCase());if(!r||!confirm("Удалить «"+n+"»?"))return;await rpc("app_admin_item_del",{...P,p_id:r.id});await load()}
 }catch(e){if(/сесс/i.test(e.message))return logout();alert(e.message)}
 adminView()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a],[data-t]");if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;flash="";adminView();return}
 const a=b.dataset.a;if(a==="out")logout();else if(a==="view"){view=view==="admin"?"main":"admin";render()}else adm(a,b.dataset.id)});
document.addEventListener("keydown",e=>{if(e.key==="/"&&$("#q")&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}});
(async()=>{if(!live){ITEMS=BASE.map((r,i)=>({id:i,...rowObj(r)}));ME={login:"демо",role:"agent"};render();return}
 if(TOK){try{const r=await rpc("app_me",{p_token:TOK});ME={login:r.label||"агент",role:r.role};boot();return}catch{try{localStorage.removeItem("pw_tok")}catch{}TOK=null}}
 loginView()})();
</script>
</body>
