name: Deploy marketplace-scan

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "supabase/functions/marketplace-scan/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-marketplace-scan.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy marketplace-scan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in GitHub repository Actions secrets."
            exit 1
          fi
          supabase functions deploy marketplace-scan --project-ref jmahfpaxurmsamxbtvzj --no-verify-jwt
