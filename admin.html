<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель · Price Watch</title>
<style>
body{margin:0;background:#080d18;color:#edf3fc;font:14px Inter,sans-serif;padding:30px}
.wrap{max-width:1000px;margin:0 auto}
.card{background:#101827;border:1px solid #26344a;padding:20px;border-radius:12px;margin-bottom:20px}
h2{margin-top:0;color:#579dff}
button{background:#579dff;border:0;color:#080d18;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer}
button:hover{background:#74b5ff}
.btn-red{background:#833;color:#faa}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;border-bottom:1px solid #202d41;text-align:left;font-size:12px}
th{color:#91a1b8}
input{background:#0b1321;border:1px solid #2a3a51;color:#fff;padding:8px;border-radius:6px;width:100%;margin-top:5px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚙️ Панель Администратора</h1>
  <p><a href="index.html" style="color:#579dff">← Вернуться на главную</a></p>

  <div class="grid">
    <div class="card">
      <h2>🔑 Генерация ключа сотрудника</h2>
      <p style="font-size:12px;color:#91a1b8">Создайте уникальный ключ для нового сотрудника компании.</p>
      <button onclick="generateKey()">Сгенерировать ключ</button>
      <div id="newKeyBox" style="margin-top:10px;font-weight:bold;color:#54d6a0"></div>
    </div>

    <div class="card">
      <h2>👥 Зарегистрированные сотрудники</h2>
      <table>
        <thead><tr><th>Логин</th><th>Роль</th></tr></thead>
        <tbody id="usersList"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>➕ Добавить товар / позицию в справочник</h2>
    <div class="grid">
      <div>
        <label>Название предмета</label>
        <input id="iName" placeholder="Например: 80 Robux">
        <label>Игра / Категория</label>
        <input id="iGame" placeholder="Roblox / MM2 / Rust">
        <label>Редкость / Тип</label>
        <input id="iRarity" placeholder="Игровая валюта">
        <label>Группа для меню</label>
        <input id="iGroup" placeholder="Roblox">
      </div>
      <div>
        <label>Цена ОТ (₽)</label>
        <input id="iFrom" type="number" placeholder="64.65">
        <label>Цена ДО (₽)</label>
        <input id="iTo" placeholder="106.49">
        <label>Порог проверки (₽)</label>
        <input id="iThreshold" type="number" placeholder="38.79">
        <label>Сигнал для проверки</label>
        <input id="iSignal" placeholder="Описание подозрительности">
      </div>
    </div>
    <div style="margin-top:15px">
      <label>Ссылка на источник</label>
      <input id="iSource" placeholder="https://starvell.com/...">
      <button onclick="addItem()" style="margin-top:15px">Добавить в базу</button>
    </div>
  </div>
</div>

<script>
// Проверка прав админа
const currentUser = JSON.parse(localStorage.getItem('sp_current_user') || 'null');
if(!currentUser || currentUser.role !== 'admin') {
  alert('Доступ запрещен! Только для администраторов.');
  location.href = 'index.html';
}

function renderAdmin() {
  // Список пользователей
  const users = JSON.parse(localStorage.getItem('sp_users') || '[]');
  document.getElementById('usersList').innerHTML = users.map(u=>`
    <tr><td>${u.username}</td><td>${u.role}</td></tr>
  `).join('');
}

function generateKey() {
  const keys = JSON.parse(localStorage.getItem('sp_keys') || '[]');
  const newKey = 'STARVELL-KEY-' + Math.random().toString(36).substring(2, 8).toUpperCase();
  keys.push(newKey);
  localStorage.setItem('sp_keys', JSON.stringify(keys));
  document.getElementById('newKeyBox').textContent = 'Сгенерирован ключ: ' + newKey;
}

function addItem() {
  const items = JSON.parse(localStorage.getItem('sp_items') || '[]');
  const newItem = {
    item: document.getElementById('iName').value,
    game: document.getElementById('iGame').value,
    rarity: document.getElementById('iRarity').value,
    group: document.getElementById('iGroup').value || 'Другие игры',
    from: Number(document.getElementById('iFrom').value),
    to: document.getElementById('iTo').value,
    threshold: Number(document.getElementById('iThreshold').value),
    signal: document.getElementById('iSignal').value,
    source: document.getElementById('iSource').value
  };
  items.push(newItem);
  localStorage.setItem('sp_items', JSON.stringify(items));
  alert('Товар успешно добавлен в справочник!');
  location.reload();
}

renderAdmin();
</script>
</body>
</html>
