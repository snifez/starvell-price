<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель</title>
<style>
body{margin:0;background:#121417;color:#e3e5e8;font:13px -apple-system,sans-serif;padding:24px}
.wrap{max-width:900px;margin:0 auto}
.card{background:#1a1d21;border:1px solid #2c3038;padding:16px;border-radius:8px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:14px;color:#fff}
button{background:#2787f5;color:#fff;border:0;padding:7px 12px;border-radius:6px;font-weight:600;cursor:pointer}
button:hover{background:#1b73d1}
.btn-red{background:#e04848}
.btn-red:hover{background:#c73b3b}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:8px 10px;border-bottom:1px solid #2c3038;text-align:left;font-size:12px}
th{color:#8a9ba8}
input{background:#121417;border:1px solid #2c3038;color:#fff;padding:6px 8px;border-radius:6px;width:100%;margin-top:4px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1 style="margin:0;font-size:18px">Панель администратора</h1>
    <a href="index.html" style="color:#2787f5;text-decoration:none">← На главную</a>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Генерация ключа сотрудника</h2>
      <button onclick="makeKey()">Создать ключ</button>
      <div id="keyOut" style="margin-top:8px;font-family:monospace;color:#f5c85b"></div>
    </div>

    <div class="card">
      <h2>Управление правами админа</h2>
      <div id="usersList"></div>
    </div>
  </div>

  <div class="card">
    <h2>Добавить товар в базу</h2>
    <div class="grid">
      <div>
        <label>Название</label><input id="iName">
        <label>Игра</label><input id="iGame">
        <label>Тип</label><input id="iRarity">
        <label>Раздел меню</label><input id="iGroup" value="Roblox">
      </div>
      <div>
        <label>Цена от</label><input id="iFrom" type="number">
        <label>Цена до</label><input id="iTo">
        <label>Порог</label><input id="iThreshold" type="number">
        <label>Сигнал</label><input id="iSignal">
      </div>
    </div>
    <label style="display:block;margin-top:8px">Источник (Ссылка)</label><input id="iSource">
    <button onclick="addItem()" style="margin-top:12px">Сохранить товар</button>
  </div>
</div>

<script src="app.js"></script>
<script>
// Жесткая проверка прав администратора
const user = getCurrentUser();
if(!user || !isAdmin(user.username)) {
  alert('Доступ запрещен. Только для администраторов.');
  location.href = 'index.html';
}

function renderAdmin() {
  const users = getUsers();
  const admins = getAdmins();
  
  document.getElementById('usersList').innerHTML = users.map(u => `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px">
      <span><b>${u.username}</b> (${u.role})</span>
      ${u.username !== 'admin' ? `<button onclick="toggleAdmin('${u.username}')" class="${admins.includes(u.username)?'btn-red':''}">${admins.includes(u.username)?'Снять админа':'Сделать админом'}</button>` : ''}
    </div>
  `).join('');
}

function makeKey() {
  const k = 'KEY-' + Math.random().toString(36).substring(2, 8).toUpperCase();
  const keys = JSON.parse(localStorage.getItem('sp_keys') || '[]');
  keys.push(k);
  localStorage.setItem('sp_keys', JSON.stringify(keys));
  document.getElementById('keyOut').textContent = k;
}

function toggleAdmin(username) {
  let admins = getAdmins();
  if(admins.includes(username)) {
    admins = admins.filter(a => a !== username);
  } else {
    admins.push(username);
  }
  localStorage.setItem('sp_admins', JSON.stringify(admins));
  renderAdmin();
}

function addItem() {
  const items = JSON.parse(localStorage.getItem('sp_items') || '[]');
  items.push({
    item: document.getElementById('iName').value,
    game: document.getElementById('iGame').value,
    rarity: document.getElementById('iRarity').value,
    group: document.getElementById('iGroup').value,
    from: Number(document.getElementById('iFrom').value),
    to: document.getElementById('iTo').value,
    threshold: Number(document.getElementById('iThreshold').value),
    signal: document.getElementById('iSignal').value,
    source: document.getElementById('iSource').value
  });
  localStorage.setItem('sp_items', JSON.stringify(items));
  alert('Добавлено!');
  location.reload();
}

renderAdmin();
</script>
</body>
</html>
